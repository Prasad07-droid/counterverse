# ══════════════════════════════════════════════════════════════
# CounterVerse — Docker Compose v2 Configuration
# ══════════════════════════════════════════════════════════════
# Default launch (FastAPI + Streamlit iframe UI):
#   docker compose up --build
#
# Optional external infrastructure profile (Neo4j + Redis):
#   docker compose --profile external-infra up --build
#
# Stop:
#   docker compose down -v

services:

  # ── FastAPI Backend ───────────────────────────────────────────
  api:
    build: .
    container_name: counterverse-api
    ports:
      - "8000:8000"
      - "9090:9090"   # Prometheus metrics
    environment:
      - COUNTERVERSE_API_HOST=0.0.0.0
      - COUNTERVERSE_API_PORT=8000
      - ENVIRONMENT=development
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ── Dashboard (Streamlit Embedding Vite React UI) ─────────────
  dashboard:
    build: .
    container_name: counterverse-dashboard
    ports:
      - "8501:8501"
    environment:
      - COUNTERVERSE_STREAMLIT_PORT=8501
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    depends_on:
      api:
        condition: service_healthy
    command: >
      streamlit run app/dashboard.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    restart: unless-stopped

  # ── Optional: Neo4j Graph Database ────────────────────────────
  # (Optional infrastructure: active pipeline uses NetworkX + JSON overlays)
  neo4j:
    profiles: ["external-infra"]
    image: neo4j:5-community
    container_name: counterverse-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ── Optional: Redis Cache ─────────────────────────────────────
  # (Optional infrastructure: active pipeline uses SQLite headline caching)
  redis:
    profiles: ["external-infra"]
    image: redis:7-alpine
    container_name: counterverse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  neo4j_data:
  redis_data:
